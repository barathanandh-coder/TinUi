version: 2
updates:
  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"

  # Go Modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-go)"

  # NPM Packages (tinui-npm & tinui-syntax)
  - package-ecosystem: "npm"
    directory: "/tinui-npm"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps-npm)"

  - package-ecosystem: "npm"
    directory: "/tinui-syntax"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps-syntax)"
