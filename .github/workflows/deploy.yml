name: Deploy TinUI to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build TinUI CLI
        run: go build -o tinui .

      - name: Compile WebAssembly Engine
        run: |
          mkdir -p public
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o public/tinui_engine.wasm ./wasm_engine

      - name: Compile UI Template
        run: |
          if [ -f "index.tin" ]; then
            ./tinui compile index.tin --hydrate || true
            if [ -f "index.ir.json" ]; then cp index.ir.json public/app.ir.json; fi
          elif [ -f "main.tin" ]; then
            ./tinui compile main.tin --hydrate || true
            if [ -f "main.ir.json" ]; then cp main.ir.json public/app.ir.json; fi
          fi

      - name: Prepare deployment assets
        run: |
          mkdir -p public
          if [ -f "tin-runtime.js" ]; then cp tin-runtime.js public/tin-runtime.js; fi
          if [ -f "assets/app_icon.png" ]; then cp assets/app_icon.png public/app_icon.png; fi
          if [ -f "$(go env GOROOT)/misc/wasm/wasm_exec.js" ]; then
            cp $(go env GOROOT)/misc/wasm/wasm_exec.js public/
          elif [ -f "$(go env GOROOT)/lib/wasm/wasm_exec.js" ]; then
            cp $(go env GOROOT)/lib/wasm/wasm_exec.js public/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
