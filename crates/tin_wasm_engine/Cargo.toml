[package]
name = "tin_wasm_engine"
version = "1.8.0"
edition = "2021"
authors = ["Barathanandh"]
description = "High-performance, zero-GC WebAssembly core engine for TinUI / TinPyUI"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlStyleElement",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "HtmlHeadElement",
    "Performance",
    "Window",
    "Node",
    "NodeList",
    "Event",
    "MouseEvent",
    "KeyboardEvent",
    "WebGlRenderingContext",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlUniformLocation",
    "DomRect",
    "CssStyleDeclaration"
] }
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
