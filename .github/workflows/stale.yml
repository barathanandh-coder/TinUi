name: Manage Stale Issues & PRs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-message: "This issue has been automatically marked as stale because it has not had recent activity. It will be closed in 7 days if no further activity occurs. Thank you for your contributions!"
          stale-issue-label: "stale"
          exempt-issue-labels: "pinned,security,rfc,roadmap"
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-pr-message: "This pull request has been automatically marked as stale due to inactivity. It will be closed in 14 days if no further updates are made."
          stale-pr-label: "stale"
